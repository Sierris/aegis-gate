name: ci

# Two jobs, deliberately separated:
#
#  * `quality`  — runs the SAME pre-commit configuration developers run locally.
#                 If a contributor bypasses the hook with `--no-verify`, this job
#                 is what catches it. `pre-commit run --all-files` is the
#                 authoritative gate; the individual tool invocations are
#                 intentionally absent so config drift is impossible.
#  * `tests`    — matrix over supported Python versions.
#
# From step 5 a third job (`integrity`) verifies, for every commit in the push,
# that a server-signed attestation covers exactly those git objects.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_SYSTEM_PYTHON: "0"
  # Deterministic, non-interactive behaviour for tools that would otherwise
  # prompt or write caches outside the workspace.
  PYTHONDONTWRITEBYTECODE: "1"
  RUFF_CACHE_DIR: ${{ github.workspace }}/.cache/ruff
  MYPY_CACHE_DIR: ${{ github.workspace }}/.cache/mypy
  PRE_COMMIT_HOME: ${{ github.workspace }}/.cache/pre-commit

jobs:
  quality:
    name: pre-commit (lint · types · hygiene)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync project
        # --all-extras matters: mypy and pytest both import the FastAPI server,
        # so a base-only install would fail type-checking and collection. The
        # extras are also part of the product surface that CI must cover.
        run: uv sync --locked --all-extras --group dev

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: .cache/pre-commit
          key: precommit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: precommit-${{ runner.os }}-

      - name: pre-commit run --all-files
        # `--show-diff-on-failure` turns a formatting violation into an
        # actionable review comment instead of an opaque failure.
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  tests:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync project for py${{ matrix.python }}
        # The venv is created for the matrix interpreter *once*, here. Skipping
        # this and relying on `uv run --python X` would re-create the environment
        # on the fly and silently drop the extras.
        run: uv sync --locked --all-extras --group dev --python ${{ matrix.python }}

      - name: Run tests
        run: uv run --no-sync --frozen pytest -q --cov --cov-report=term-missing

  integrity:
    name: attestation integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The verifier needs the commit range and the notes ref, so the full
          # graph must be present.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --all-extras --group dev

      # The verifier itself, exercised against real repositories and real
      # signatures (forgery, wrong audience, expiry, rewritten commit, tampered note).
      - name: Verifier test suite
        run: uv run --no-sync pytest tests/test_verify.py tests/test_gitx.py -q

      # Enforcement needs a trust anchor. Two supported ways: a repository secret
      # with the JWKS URL/document, or a pinned `.aegis/jwks.json`. Without either,
      # this job reports that enforcement is not configured for this repository —
      # it does not pretend to have verified anything.
      - name: Pin the trust anchor
        if: env.AEGIS_JWKS != ''
        env:
          AEGIS_JWKS: ${{ vars.AEGIS_JWKS_URL }}
        run: uv run --no-sync aegis keys export --out .aegis/jwks.json

      - name: Verify the pushed range
        env:
          AEGIS_JWKS: ${{ vars.AEGIS_JWKS_URL }}
        run: |
          set -euo pipefail
          if [ -z "${AEGIS_JWKS:-}" ] && [ ! -f .aegis/jwks.json ]; then
            echo "::notice::Sin ancla de confianza configurada (AEGIS_JWKS_URL)."
            echo "El mecanismo está cubierto por los tests; el enforcement se activa por repositorio."
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          echo "Verificando $RANGE"
          uv run --no-sync aegis verify --range "$RANGE"

  digest-stability:
    name: digest format is frozen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked --all-extras --group dev

      # A change to the digest format silently invalidates every attestation ever
      # issued. This job makes such a change fail loudly and by name.
      - name: Golden digest must not change
        run: uv run --no-sync pytest tests/test_canon.py -q -k "golden or golden_value"
