[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aegis-gate"
version = "0.1.0"
description = "AppSec GenAI commit gate: server-side LLM analysis with signed integrity attestations"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Juan Sierra", email = "jesierra20@gmail.com" }]
keywords = ["appsec", "devsecops", "owasp", "llm", "pre-commit", "supply-chain"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

# Runtime dependencies per component. The hook client stays intentionally thin
# (stdlib + pydantic) so `pre-commit` environment creation is fast and does not
# drag a web framework into every developer machine.
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.4,<3",
  # HTTP client used by both the CLI and the server (GitHub token exchange).
  "httpx>=0.27",
  # JWS/JWT: verified EdDSA only, with an explicit algorithm allowlist.
  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
# Server-side stack. Persistence is stdlib sqlite3 + hand-written SQL on
# purpose (see auth/store.py): no ORM between a security component and its data.
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # Required by `await request.form()` on the /device approval page. It used to
  # arrive transitively; a re-resolve dropped it and only the test suite noticed.
  # Declared explicitly so a clean install cannot lose the device flow.
  "python-multipart>=0.0.9",
]
# NOTE: there is deliberately no `detectors` extra. The deterministic pre-filter is
# an in-tree rule pack (src/aegis/detectors) rather than semgrep/bandit, because the
# hook sits in the commit path and a semgrep run costs seconds per commit. The
# anchors only need to be good enough to ground and cross-check the model, not to be
# a full SAST engine — see docs/architecture.md §5.
# NOTE: tooling lives in [dependency-groups] below (PEP 735), not here. Keeping a
# single definition avoids the classic drift where `--all-extras` and
# `--group dev` install different versions of ruff/mypy.

[project.scripts]
# Hook entrypoint (git passes staged filenames; we ignore them and re-derive the
# staged set from the index so a partial `git add -p` cannot be bypassed).
aegis-hook = "aegis.cli.hook:main"
# post-commit: binds the attestation to the commit object that now exists, after
# verifying that its digest matches what was analysed.
aegis-attest = "aegis.cli.hook:attest_main"
# pre-push: verifies exactly the commits being pushed (local fast feedback).
aegis-pre-push = "aegis.cli.verify:pre_push_main"
# Admin/developer CLI: login, analyze manually, verify commits, override.
aegis = "aegis.cli.main:main"
# Server.
aegis-server = "aegis.server.main:main"

[project.urls]
Homepage = "https://github.com/jesierra20/aegis-gate"

#: Single source of truth for tooling versions. pre-commit invokes these exact
#: binaries (see .pre-commit-config.yaml), so CI and a developer machine cannot
#: disagree about what "lint clean" means.
[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.17",
  "mypy>=1.11",
  "pre-commit>=3.8",
  # TestClient + respx-style transport injection for the API tests.
  "anyio>=4.4",
  "httpx2>=2.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["aegis"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # bugbear
  "S",    # bandit (dogfooding: the project scans itself)
  "C4",   # comprehensions
  "DTZ",  # timezone-aware datetimes
  "T20",  # no bare print in library code
  "PT",   # pytest style
  "SIM",  # simplify
  "ARG",  # unused arguments
  "PL",   # pylint subset
  "RUF",
]
ignore = [
  "PLR0913",  # explicit keyword args are good in a protocol layer
  "PLR2004",  # magic values in digest format are intentional
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately: assert (S101), use literal fixture passwords (S105/S106),
# reach into internals to prove the audit chain detects tampering (SLF001),
# import inside fixtures to keep module import cost out of the common path, and
# split assertions deliberately for clearer failure messages.
# The examples are *deliberately* vulnerable: they are the demo of the gate. Any
# rule whose autofix would rewrite them (UP031 turns `%` into `.format`, which is a
# different code path) or whose warning is the point of the file (S605/S608/S324/
# S311 are exactly what AEGIS is supposed to report) is disabled here on purpose.
"examples/**" = ["S", "UP", "T20", "ARG", "DTZ", "PLR2004", "E501"]

"tests/*" = [
  "S101", "S103", "S105", "S106", "S108", "S603", "S607", "SLF001",
  "PLR2004", "ARG001", "ARG002", "RUF059",
  "PT018", "PLC0415", "SIM117", "PLR0911",
]
"src/aegis/cli/*" = ["T20"]  # CLI genuinely prints to the terminal

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
